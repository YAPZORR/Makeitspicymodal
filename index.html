<html lang="en">

<meta charset="utf-8">

<title>Get this pose – Makeitspicy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0206;
  --card: #17070f;
  --text: #fdf4f8;
  --text-2: #e7c6d5;
  --muted: #b98ea3;
  --line: rgba(255, 140, 190, .14);
  --line-2: rgba(255, 140, 190, .26);
  --pink: #fc2c86;
  --pink-soft: #ffa7cf;
  --magenta: #c01d78;
  --gold-text: #ffd351;
  --teal: #33d6da;
  --pink-grad: linear-gradient(92deg, #ff5fa2 0%, #fc2c86 48%, #d81e77 100%);
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
/* Makeitspicy is dark-only by design; both theme hooks resolve to the same palette. */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0a0206; --card: #17070f; --text: #fdf4f8; } }
:root[data-theme="dark"] { --bg: #0a0206; --card: #17070f; --text: #fdf4f8; }

*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); background-color: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%;
  display: grid; place-items: center; padding: 1.5rem;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; flex: none; }
img { display: block; }
:focus-visible { outline: 2px solid var(--pink-soft); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Blurred app behind the modal */
.backdrop { position: fixed; inset: 0; z-index: -2; overflow: hidden; }
.backdrop-grid { position: absolute; inset: -6%; display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.25rem; padding: 5rem 4rem; filter: blur(32px) saturate(1.3) brightness(.5); transform: scale(1.06); }
.backdrop-grid span { border-radius: 1.25rem; min-height: 15rem; }
.backdrop::after { content: ""; position: absolute; inset: 0; background: radial-gradient(60rem 44rem at 50% 45%, rgba(10, 2, 6, .55), rgba(10, 2, 6, .86) 72%), radial-gradient(40rem 30rem at 12% 8%, rgba(180, 20, 90, .38), transparent 60%), radial-gradient(40rem 30rem at 92% 92%, rgba(200, 30, 120, .32), transparent 60%); }

/* ---------- Modal ---------- */
.modal {
  position: relative; overflow: hidden; isolation: isolate;
  width: min(60rem, 100%);
  border-radius: 1.75rem;
  background: rgba(16, 6, 12, .95);
  border: 1.5px solid rgba(255, 90, 160, .38);
  box-shadow: 0 2.5rem 6rem rgba(0, 0, 0, .6), 0 0 5rem rgba(220, 30, 120, .24), inset 0 1px 0 rgba(255, 255, 255, .05);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  animation: in .5s cubic-bezier(.2, .8, .2, 1) both;
}
@keyframes in { from { opacity: 0; transform: translateY(1rem) scale(.98); } to { opacity: 1; transform: none; } }
.glow { position: absolute; z-index: -1; border-radius: 50%; filter: blur(50px); pointer-events: none; }
.glow.g1 { width: 26rem; height: 20rem; left: -6rem; top: -6rem; background: radial-gradient(closest-side, rgba(252, 44, 134, .3), transparent 70%); }
.glow.g2 { width: 24rem; height: 20rem; right: -6rem; bottom: -6rem; background: radial-gradient(closest-side, rgba(180, 30, 220, .26), transparent 70%); }

.head { position: relative; text-align: center; padding: 1.6rem 3.5rem 1.1rem; }
.head .tag { display: inline-flex; align-items: center; gap: .5rem; height: 2rem; padding: 0 .95rem; border-radius: 999px; font-size: .72rem; font-weight: 700; letter-spacing: .12em; color: #ffd0e4; background: rgba(252, 44, 134, .18); border: 1px solid rgba(255, 90, 160, .55); }
.head .tag svg { width: 1rem; height: 1rem; }
.head h1 { margin: .7rem 0 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; }
.head h1 em { font-style: normal; background: var(--pink-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.head p { margin: .4rem 0 0; font-size: 1rem; color: var(--text-2); }
.close { position: absolute; top: 1.1rem; right: 1.1rem; width: 2.5rem; height: 2.5rem; border-radius: 50%; display: grid; place-items: center; background: rgba(30, 10, 20, .7); border: 1px solid var(--line-2); transition: background-color .2s ease, transform .2s ease; }
.close:hover { background: rgba(60, 16, 36, .85); transform: rotate(90deg); }
.close svg { width: 1.1rem; height: 1.1rem; }

/* Before / after pair */
.pair { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; padding: 0 1.75rem; }
.frame { position: relative; isolation: isolate; aspect-ratio: 3 / 4; border-radius: 1.25rem; overflow: hidden; border: 1.5px solid rgba(255, 130, 180, .4); box-shadow: 0 1rem 2.5rem rgba(0, 0, 0, .45), 0 0 2rem rgba(252, 44, 134, .2); }
.frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
.frame .lbl { position: absolute; top: .8rem; left: .8rem; z-index: 3; height: 1.75rem; padding: 0 .8rem; display: inline-flex; align-items: center; border-radius: 999px; font-size: .72rem; font-weight: 700; letter-spacing: .1em; background: rgba(10, 2, 8, .68); border: 1px solid rgba(255, 255, 255, .25); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.frame--after .lbl { color: #fff; background: rgba(252, 44, 134, .8); border-color: transparent; }
.frame--after .play { position: absolute; left: 50%; top: 50%; z-index: 3; width: 3.5rem; height: 3.5rem; transform: translate(-50%, -50%); border-radius: 50%; display: grid; place-items: center; background: rgba(20, 6, 14, .55); border: 2px solid var(--pink); box-shadow: 0 0 1.5rem rgba(252, 44, 134, .7); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.frame--after .play svg { width: 1.4rem; height: 1.4rem; margin-left: .15rem; }

/* Controls stacked over the "before" frame */
.controls { position: absolute; left: .9rem; right: .9rem; bottom: .9rem; z-index: 4; display: grid; gap: .65rem; }
.upload { position: relative; overflow: hidden; height: 3.25rem; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: .6rem; font-size: 1.0625rem; font-weight: 700; color: #fff; background: var(--pink-grad); box-shadow: 0 .5rem 1.5rem rgba(0, 0, 0, .4), 0 0 1.5rem rgba(252, 44, 134, .55), inset 0 1px 0 rgba(255, 255, 255, .4); transition: filter .2s ease, transform .15s ease; }
.upload:hover { filter: brightness(1.07); } .upload:active { transform: scale(.98); }
.upload svg { width: 1.25rem; height: 1.25rem; }
.upload .ad-badge { position: absolute; left: .5rem; top: 50%; transform: translateY(-50%); height: 1.35rem; padding: 0 .45rem; display: inline-flex; align-items: center; border-radius: 999px; font-size: .6rem; font-weight: 800; letter-spacing: .08em; color: #fff; background: rgba(20, 4, 14, .5); }
.upload::after { content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 26%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .4), transparent); transform: skewX(-18deg); transition: left .6s ease; }
.upload:hover::after { left: 130%; }
.select { height: 3.25rem; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: .6rem; font-size: 1.0625rem; font-weight: 700; color: var(--text); background: rgba(10, 2, 8, .55); border: 1.5px dashed rgba(255, 160, 200, .6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: background-color .2s ease, border-color .2s ease; }
.select:hover { background: rgba(252, 44, 134, .16); border-color: rgba(255, 180, 214, .85); }
.select svg { width: 1.2rem; height: 1.2rem; }

.arrow-node { position: absolute; left: 50%; top: 50%; z-index: 5; width: 3.25rem; height: 3.25rem; transform: translate(-50%, -50%); border-radius: 50%; display: grid; place-items: center; background: #0c0208; border: 1.5px solid rgba(255, 120, 180, .6); box-shadow: 0 0 1.5rem rgba(252, 44, 134, .6); }
.arrow-node svg { width: 1.4rem; height: 1.4rem; }

/* Uploaded preview state */
.frame--before .preview { display: none; position: absolute; inset: 0; z-index: 2; background: #12040a; }
.frame--before .preview img { position: static; width: 100%; height: 100%; object-fit: contain; }
.frame--before.has-file .preview { display: block; }
.frame--before.has-file .pose-ref { opacity: .12; }
.pose-ref { transition: opacity .3s ease; }
.reset { display: none; position: absolute; top: .8rem; right: .8rem; z-index: 5; height: 2rem; padding: 0 .8rem; align-items: center; gap: .35rem; border-radius: 999px; font-size: .8125rem; font-weight: 600; background: rgba(10, 2, 8, .78); border: 1px solid rgba(255, 140, 190, .4); }
.frame--before.has-file .reset { display: inline-flex; }
.reset svg { width: .95rem; height: .95rem; }

/* Footer */
.foot { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 1rem; padding: 1.5rem 1.75rem 1.75rem; }
.round { width: 3.5rem; height: 3.5rem; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .03); border: 1px solid var(--line-2); color: var(--text-2); transition: background-color .2s ease, color .2s ease, transform .2s ease; }
.round:hover { background: rgba(252, 44, 134, .14); color: #fff; }
.round svg { width: 1.4rem; height: 1.4rem; }
.round.spin:hover svg { transform: rotate(45deg); transition: transform .3s ease; }
.generate { position: relative; overflow: hidden; height: 4rem; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: .7rem; font-size: 1.375rem; font-weight: 800; letter-spacing: .02em; color: #fff; background: var(--pink-grad); box-shadow: 0 0 2.5rem rgba(252, 44, 134, .5), inset 0 1px 0 rgba(255, 255, 255, .4); transition: filter .2s ease, transform .15s ease; }
.generate:hover { filter: brightness(1.07); } .generate:active { transform: scale(.99); }
.generate .spark { width: 1.5rem; height: 1.5rem; color: #fff; }
.generate .cost { display: inline-flex; align-items: center; gap: .35rem; height: 2.1rem; padding: 0 .8rem 0 .6rem; border-radius: 999px; background: rgba(30, 4, 18, .5); font-size: 1.15rem; color: var(--gold-text); }
.generate .cost .coin { width: 1.25rem; height: 1.25rem; border-radius: 50%; background: radial-gradient(circle at 36% 30%, #fff3a6 0 10%, #ffd83f 34%, #f7ad10 72%, #dc8d00 100%); box-shadow: inset 0 -1px 2px rgba(150, 80, 0, .45); }
.generate::before { content: ""; position: absolute; inset: 0; z-index: -1; width: var(--p, 0%); background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.22)); transition: width .12s linear; }
.generate.is-busy { cursor: progress; }
.generate::after { content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 24%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .4), transparent); transform: skewX(-18deg); animation: sheen 3.6s ease-in-out 1.2s infinite; }
@keyframes sheen { 0% { left: -40%; } 45%, 100% { left: 130%; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }

/* Responsive */
@media (max-width: 720px) {
  body { padding: 0; }
  .modal { min-height: 100vh; border-radius: 0; border: 0; width: 100%; display: flex; flex-direction: column; }
  .head { padding: 1.4rem 3rem 1rem; }
  .pair { grid-template-columns: 1fr; gap: 1rem; }
  .frame--after { display: none; }
  .arrow-node { display: none; }
  .frame { aspect-ratio: 3 / 3.4; }
  .foot { margin-top: auto; grid-template-columns: auto 1fr auto; padding: 1.25rem; }
  .generate { height: 3.5rem; font-size: 1.15rem; }
  .round { width: 3rem; height: 3rem; }
}
@media (max-width: 420px) {
  .head h1 { font-size: 1.35rem; }
  .generate .cost { display: none; }
  .generate::after { display: none; }
}
</style>
</head>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v5.5M12 7.6v.1"/></svg>
    </button>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  // Blurred backdrop tiles use brand gradients (no external images).
  const grads = ['linear-gradient(180deg,#8a7ad6,#d98fc0 60%,#ffd3b0)','linear-gradient(180deg,#2b1b5e,#7b2f8f 40%,#e85d8a)','linear-gradient(180deg,#1a1148,#3b1e63 45%,#7a2f74)','linear-gradient(180deg,#24145e,#3b6bd6 55%,#6fd0e8)','radial-gradient(120% 90% at 30% 20%,#6a2fae,#2a1055 55%,#0d0430)'];
  const bd = $('bd');
  for (let i = 0; i < 10; i++) { const s = document.createElement('span'); s.style.background = grads[i % grads.length]; bd.appendChild(s); }

  // Upload / select photo
  const before = $('before'), file = $('file'), upImg = $('upImg');
  let upURL = null, hasFile = false;
  const openPicker = () => file.click();
  $('upload').addEventListener('click', openPicker);
  $('select').addEventListener('click', openPicker);
  function accept(f) {
    if (!f || !/^image\/(png|jpeg)$/.test(f.type)) return;
    if (upURL) URL.revokeObjectURL(upURL);
    upURL = URL.createObjectURL(f);
    upImg.src = upURL; before.classList.add('has-file'); hasFile = true;
  }
  file.addEventListener('change', () => { accept(file.files[0]); file.value = ''; });
  $('reset').addEventListener('click', () => { if (upURL) URL.revokeObjectURL(upURL); upURL = null; upImg.removeAttribute('src'); before.classList.remove('has-file'); hasFile = false; });
  ['dragenter', 'dragover'].forEach((ev) => before.addEventListener(ev, (e) => e.preventDefault()));
  before.addEventListener('drop', (e) => { e.preventDefault(); accept(e.dataTransfer.files[0]); });

  // Generate with progress
  const gen = $('generate'), genText = $('genText');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let busy = false;
  gen.addEventListener('click', () => {
    if (busy) return;
    busy = true; gen.classList.add('is-busy');
    const total = reduceMotion ? 500 : 2600, start = performance.now();
    const tick = (now) => {
      const k = Math.min(1, (now - start) / total);
      const p = Math.round((1 - Math.pow(1 - k, 2)) * 100);
      gen.style.setProperty('--p', p + '%');
      genText.textContent = 'GENERATING ' + p + '%';
      if (k < 1) { requestAnimationFrame(tick); return; }
      genText.textContent = 'DONE ✓';
      gen.style.setProperty('--p', '0%');
      setTimeout(() => { genText.textContent = 'GENERATE'; gen.classList.remove('is-busy'); busy = false; }, 1800);
      // ▼ Hand off to your generator here.
    };
    requestAnimationFrame(tick);
  });

  $('close').addEventListener('click', () => { /* wire to your app's modal close */ });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('close').click(); });
})();
</script>
